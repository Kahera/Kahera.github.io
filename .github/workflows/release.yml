name: Release

on: 
    push: 
        branches: 
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    build: 
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Cache node modules
              id: cache-nodemodules
              uses: actions/cache@v4
              with:
                  path: node_modules
                  key: ${{ runner.os }}-${{ runner.arch }}-node-${{ steps.setup-node.outputs.node-version }}-modules-${{ hashFiles('package.json', 'package-lock.json') }}

            - name: Install dependencies
              if: steps.cache-nodemodules.outputs.cache-hit != 'true'
              run: npm ci --strict-peer-deps

            - name: Audit dependencies
              run: npm audit --audit-level=high

            - name: Lint
              run: npm run lint -- --no-fix

            - name: Build
              run: | 
                npm run build

            - name: Test
              run: npm run test -- --run

            - name: Upload pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
        permissions:
            pages: write      # to deploy to Pages
            id-token: write   # to verify the deployment originates from an appropriate source
        # Deploy to the github-pages environment
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }} # Output from deploy step below

        steps:
          - name: Deploy to GitHub Pages
            id: deployment
            uses: actions/deploy-pages@v4
