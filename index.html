<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="description"
    content="June Hansen, developer, beekeeper, and maker. Thoughtful software and a life full of sewing, 3D printing, electronics, woodworking, and board games.">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="icon" href="/src/assets/images/Kahera.webp">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>June Hansen</title>
<script>
  try {
    const savedTheme = localStorage.getItem('theme');
    const dark = savedTheme === 'dark' || (savedTheme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
  } catch {
    document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
</script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
